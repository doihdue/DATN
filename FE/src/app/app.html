@if (isTvDisplay()) {
  <!-- Màn hình gọi số TV sảnh chờ: Hiển thị Full màn hình 100%, không bị chèn sidebar/topbar/navbar dù đăng nhập hay chưa -->
  <main class="tv-display-viewport">
    <router-outlet></router-outlet>
  </main>
} @else if (authService.isStaffOrMedicalUser()) {
  <!-- Màn nội bộ (Admin, Bác sĩ, KTV, Lễ tân): menu trái cố định + thanh trên -->
  <div class="app-sidebar-layout">
    <app-sidebar></app-sidebar>
    <div class="layout-body-wrapper" [class.sidebar-pinned]="sidebarService.isPinned()">
      <app-topbar></app-topbar>
      <main class="main-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
} @else {
  <!-- Cổng bệnh nhân, khách và màn hình gọi số -->
  <div class="app-layout">
    <app-navbar></app-navbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="app-footer">
      <div class="footer-container">
        <span class="footer-brand">MedQueue</span>
        <span class="footer-copy">Đặt lịch khám và theo dõi số thứ tự tại phòng khám</span>
      </div>
    </footer>

    <app-chat-widget></app-chat-widget>
  </div>
}
