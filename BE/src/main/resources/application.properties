spring.application.name=BE
server.port=8080

# Cấu hình UTF-8 toàn diện cho HTTP Servlet
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Cấu hình JWT (JSON Web Token)
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Thời hạn Access Token: 24 giờ (86400000 ms)
application.security.jwt.expiration=86400000
# Thời hạn Refresh Token: 7 ngày (604800000 ms)
application.security.jwt.refresh-token.expiration=604800000

# Cấu hình kết nối SQL Server (Bắt buộc hỗ trợ đầy đủ Unicode tiếng Việt có dấu)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DATN;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8;sendTimeAsDatetime=false;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# BẮT BUỘC CHO SQL SERVER: Tự động chuyển toàn bộ String thành kiểu NVARCHAR (Unicode) thay vì VARCHAR
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Nạp các quan hệ lazy theo lô (IN ...) thay vì từng bản ghi một, tránh N+1 khi trả danh sách
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Cấu hình Chat tư vấn AI (Google Gemini)
# API key lấy tại https://aistudio.google.com/apikey rồi đặt vào biến môi trường GEMINI_API_KEY (KHÔNG ghi key vào file này).
# Để trống thì chatbot tự chuyển sang chế độ dự phòng (gợi ý theo từ khóa).
gemini.api-key=${GEMINI_API_KEY:}
# Bản Flash-Lite: nhanh (~2 giây) và đủ tốt cho việc gợi ý chuyên khoa. Đổi model qua biến GEMINI_MODEL
gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}
# Model dự phòng (cách nhau bằng dấu phẩy), dùng khi model chính quá tải/treo, hết hạn mức (429) hoặc bị ngừng (404)
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-flash-latest}
# Thời gian chờ tối đa cho MỖI model trước khi chuyển sang model kế tiếp
gemini.timeout-seconds=15
gemini.temperature=0.3

# Cấu hình AI Service (FastAPI) - Tách riêng module AI
# ai.service.url=http://localhost:8000


# Cấu hình Đặt lịch khám online
# Bệnh nhân chỉ được tự huỷ/đổi lịch trước giờ khám dự kiến ít nhất N giờ
appointment.change-deadline-hours=2
# Cho phép đặt lịch trước tối đa N ngày
appointment.max-days-ahead=30

# ==========================================
# CẤU HÌNH THÔNG BÁO EMAIL TỰ ĐỘNG (SPRING MAIL SMTP)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:phongkham.smartclinic.datn@gmail.com}
spring.mail.password=${MAIL_PASSWORD:hndkotisiinunnvs}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Tên & Địa chỉ hiển thị người gửi
app.mail.from-name=Phòng Khám Thông Minh SmartClinic
app.mail.from-address=${MAIL_FROM:phongkham.smartclinic.datn@gmail.com}
# Bật/Tắt gửi email thực tế (nếu false sẽ ghi log mô phỏng)
app.mail.enabled=${MAIL_ENABLED:true}

# Giờ chạy cron job nhắc lịch hẹn khám trong ngày (mặc định 07:00 sáng mỗi ngày)
app.mail.reminder-cron=${REMINDER_CRON:0 0 7 * * ?}

